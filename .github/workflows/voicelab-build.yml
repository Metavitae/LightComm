name: Voice Lab build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["voicelab/**", ".github/workflows/voicelab-build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicelab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voicelab-apk
          path: voicelab/app/build/outputs/apk/debug/app-debug.apk
